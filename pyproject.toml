[project]
name = "tracer-agent-python"
version = "0.1.0"
description = "LangGraph로 구현한 에이전트 서비스"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tracer_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "A", "SLF", "ARG", "SIM", "C4", "PIE", "PERF", "RET", "RUF"]

[tool.ruff.lint.per-file-ignores]
# 테스트는 표본 데이터 한 줄 표현을 위해 긴 줄을 허용한다.
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["tracer_agent"]
mypy_path = "src"
strict = true
